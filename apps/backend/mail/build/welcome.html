
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>.mb-2 {
  margin-bottom: 0.5rem;
}</style>
    
      <div class="hidden max-h-0 overflow-hidden opacity-0" style="display: none; max-height: 0px; overflow: hidden; opacity: 0;">Verify your email address to get started.</div>
    </head>
  <body class="bg-gray-100 py-8 font-sans" style="background-color: rgb(243, 244, 246); padding-top: 2rem; padding-bottom: 2rem; font-family: ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';">
    <div class="mx-auto max-w-xl rounded-xl bg-white p-8 shadow" style="margin-left: auto; margin-right: auto; max-width: 36rem; border-radius: 0.75rem; background-color: rgb(255, 255, 255); padding: 2rem; box-shadow: 0 0 #0000, 0 0 #0000, 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);">
      
  <h1 class="mb-4 text-2xl font-bold text-gray-800" style="margin-bottom: 1rem; font-size: 1.5rem; line-height: 2rem; font-weight: 700; color: rgb(31, 41, 55);">Welcome, {{ name }}!</h1>
  <p class="mb-6 text-gray-600" style="margin-bottom: 1.5rem; color: rgb(75, 85, 99);">
    Thanks for signing up. Please verify your email address to activate your account.
  </p>
  <a href="{{ activationUrl }}" class="inline-block rounded-lg bg-blue-600 px-6 py-3 font-semibold text-white no-underline" style="display: inline-block; border-radius: 0.5rem; background-color: rgb(37, 99, 235); padding-left: 1.5rem; padding-right: 1.5rem; padding-top: 0.75rem; padding-bottom: 0.75rem; font-weight: 600; color: rgb(255, 255, 255); text-decoration-line: none;">
    Verify Email
  </a>
  <p class="mt-6 text-sm text-gray-400" style="margin-top: 1.5rem; font-size: 0.875rem; line-height: 1.25rem; color: rgb(156, 163, 175);">If you did not create an account, please ignore this email.</p>

    </div>
    <p class="mt-6 text-center text-xs text-gray-400" style="margin-top: 1.5rem; text-align: center; font-size: 0.75rem; line-height: 1rem; color: rgb(156, 163, 175);">
      You received this email because you have an account with us.
    </p>
  </body>
</html>
