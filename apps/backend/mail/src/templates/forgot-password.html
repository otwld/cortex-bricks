---
preheader: "Reset your password."
---

<x-main>
  <h1 class="mb-4 text-2xl font-bold text-gray-800">Reset your password</h1>
  <p class="mb-2 text-gray-600">Hi @{{ name }},</p>
  <p class="mb-6 text-gray-600">
    Click the button below to reset your password. This link expires in @{{ expiresIn }}.
  </p>
  <a href="@{{ resetUrl }}" class="inline-block rounded-lg bg-blue-600 px-6 py-3 font-semibold text-white no-underline">
    Reset Password
  </a>
  <p class="mt-6 text-sm text-gray-400">If you did not request a password reset, please ignore this email.</p>
</x-main>
