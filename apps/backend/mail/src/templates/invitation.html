---
preheader: "Accept your invitation."
---

<x-main>
  <h1 class="mb-4 text-2xl font-bold text-gray-800">You are invited</h1>
  <p class="mb-2 text-gray-600">Hi @{{ name }},</p>
  <p class="mb-6 text-gray-600">
    Use the button below to finish setting up your account. This link expires in @{{ expiresIn }}.
  </p>
  <a href="@{{ invitationUrl }}" class="inline-block rounded-lg bg-blue-600 px-6 py-3 font-semibold text-white no-underline">
    Accept Invitation
  </a>
  <p class="mt-6 text-sm text-gray-400">If you were not expecting this invitation, please ignore this email.</p>
</x-main>
