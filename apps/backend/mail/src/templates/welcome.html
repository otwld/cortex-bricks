---
preheader: "Verify your email address to get started."
---

<x-main>
  <h1 class="mb-4 text-2xl font-bold text-gray-800">Welcome, @{{ name }}!</h1>
  <p class="mb-6 text-gray-600">
    Thanks for signing up. Please verify your email address to activate your account.
  </p>
  <a href="@{{ activationUrl }}" class="inline-block rounded-lg bg-blue-600 px-6 py-3 font-semibold text-white no-underline">
    Verify Email
  </a>
  <p class="mt-6 text-sm text-gray-400">If you did not create an account, please ignore this email.</p>
</x-main>
