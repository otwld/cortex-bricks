{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.secretName" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.values.jwtSecret is required when secrets.existingSecret is empty" .Values.secrets.values.jwtSecret | quote }}
  JWT_REFRESH_SECRET: {{ required "secrets.values.jwtRefreshSecret is required when secrets.existingSecret is empty" .Values.secrets.values.jwtRefreshSecret | quote }}
  GOOGLE_CLIENT_ID: {{ required "secrets.values.googleClientId is required when secrets.existingSecret is empty" .Values.secrets.values.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ required "secrets.values.googleClientSecret is required when secrets.existingSecret is empty" .Values.secrets.values.googleClientSecret | quote }}
  GITHUB_CLIENT_ID: {{ required "secrets.values.githubClientId is required when secrets.existingSecret is empty" .Values.secrets.values.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ required "secrets.values.githubClientSecret is required when secrets.existingSecret is empty" .Values.secrets.values.githubClientSecret | quote }}
  {{- if .Values.secrets.values.mongodbUri }}
  MONGODB_URI: {{ .Values.secrets.values.mongodbUri | quote }}
  {{- end }}
  MINIO_ACCESS_KEY: {{ required "secrets.values.minioAccessKey is required when secrets.existingSecret is empty" .Values.secrets.values.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ required "secrets.values.minioSecretKey is required when secrets.existingSecret is empty" .Values.secrets.values.minioSecretKey | quote }}
  {{- if eq .Values.config.mail.transport "postal" }}
  POSTAL_API_KEY: {{ required "secrets.values.postalApiKey is required when config.mail.transport is postal" .Values.secrets.values.postalApiKey | quote }}
  {{- end }}
  {{- if eq .Values.config.mail.transport "smtp" }}
  SMTP_USER: {{ .Values.secrets.values.smtpUser | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.values.smtpPassword | quote }}
  {{- end }}
  {{- if .Values.config.ai.openaiApiKey.value }}
  OPENAI_API_KEY: {{ .Values.config.ai.openaiApiKey.value | quote }}
  {{- end }}
{{- end }}
