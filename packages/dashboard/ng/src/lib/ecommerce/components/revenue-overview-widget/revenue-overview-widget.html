<div class="card h-full">
  <div class="mb-12 flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <span class="text-xl font-semibold text-surface-900 dark:text-surface-0">{{ title() }}</span>

    @if (showPeriodSelector() && periodOptions().length > 1) {
    <p-select
      class="w-full sm:w-40"
      optionLabel="label"
      [ariaLabel]="periodSelectAriaLabel()"
      [options]="periodOptions()"
      [ngModel]="selectedPeriod()"
      [disabled]="periodSelectDisabled()"
      (onChange)="selectPeriod($event.value)"
    />
    }
  </div>

  @if (chartData().datasets.length) {
  <p-chart type="bar" [data]="chartData()" [options]="resolvedChartOptions()" [class]="chartClass()" (onDataSelect)="selectChartData($event)" />
  } @else {
  <div class="flex h-80 items-center justify-center rounded-border border border-surface-200 text-center text-muted-color dark:border-surface-700">
    {{ emptyMessage() }}
  </div>
  }
</div>
