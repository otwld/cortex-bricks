<p-card>
  <div class="mb-6 flex items-center justify-between gap-4">
    <div class="font-semibold text-xl text-surface-900 dark:text-surface-0">{{ title() }}</div>

    @if (menuItems().length) {
    <div class="flex shrink-0 items-center">
      <p-button
        type="button"
        icon="pi pi-ellipsis-v"
        [rounded]="true"
        [text]="true"
        [plain]="true"
        [ariaLabel]="actionMenuAriaLabel()"
        (click)="menu.toggle($event)"
      />
      <p-menu #menu [popup]="true" [model]="menuItems()" />
    </div>
    }
  </div>

  @if (groupViewModels().length) {
  <div class="flex flex-col gap-6">
    @for (group of groupViewModels(); track group.id) {
    <section>
      <span class="mb-4 block font-medium text-muted-color">{{ group.label }}</span>
      <ul class="m-0 list-none p-0">
        @for (notification of group.notifications; track notification.id; let last = $last) {
        <li class="py-2" [class.border-b]="!last" [class.border-surface]="!last">
          <button
            type="button"
            class="flex w-full cursor-pointer items-center border-0 bg-transparent p-0 text-left transition-colors hover:text-primary focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-primary"
            [attr.aria-label]="notification.ariaLabel ?? notification.textLabel"
            (click)="selectNotification(group, notification)"
          >
            <span class="mr-4 flex h-12 w-12 shrink-0 items-center justify-center rounded-full" [class]="notification.iconContainerClass">
              <i class="text-xl!" [class]="notification.icon + ' ' + notification.iconClass"></i>
            </span>
            <span class="leading-normal">
              @for (part of notification.parts; track $index) {
              <span [class]="part.className">{{ part.text }}</span>
              }
            </span>
          </button>
        </li>
        }
      </ul>
    </section>
    }
  </div>
  } @else {
  <div class="rounded-border border border-surface-200 p-6 text-center text-muted-color dark:border-surface-700">{{ emptyMessage() }}</div>
  }
</p-card>
