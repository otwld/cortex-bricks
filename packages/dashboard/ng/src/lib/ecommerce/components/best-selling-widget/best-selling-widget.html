<div class="card">
  <div class="mb-6 flex items-center justify-between gap-4">
    <div class="font-semibold text-xl text-surface-900 dark:text-surface-0">{{ title() }}</div>
    <div class="flex shrink-0 items-center">
      <p-button
        type="button"
        icon="pi pi-ellipsis-v"
        [rounded]="true"
        [text]="true"
        [plain]="true"
        ariaLabel="Best selling products actions"
        (click)="menu.toggle($event)"
      />
      <p-menu #menu [popup]="true" [model]="menuItems()" />
    </div>
  </div>

  @if (productViewModels().length) {
  <ul class="m-0 flex list-none flex-col gap-6 p-0">
    @for (product of productViewModels(); track product.id) {
    <li class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between md:gap-8">
      <div class="min-w-0">
        <span class="block truncate font-medium text-surface-900 dark:text-surface-0">{{ product.name }}</span>
        <div class="mt-1 text-muted-color">{{ product.category }}</div>
      </div>
      <div class="flex min-w-40 items-center md:min-w-56">
        <p-progressbar
          class="h-2 flex-1 overflow-hidden rounded-border"
          [value]="product.salesShare"
          [showValue]="false"
          [valueStyleClass]="product.progressClass"
        />
        <span class="ml-4 w-12 text-right font-medium" [class]="product.textClass">{{ product.percentLabel }}</span>
      </div>
    </li>
    }
  </ul>
  } @else {
  <div class="rounded-border border border-surface-200 p-6 text-center text-muted-color dark:border-surface-700">No best-selling products to display.</div>
  }
</div>
