<div class="card h-full">
  <div class="mb-12 text-xl font-semibold text-surface-900 dark:text-surface-0">{{ title() }}</div>

  @if (chartData().datasets.length) {
  <p-chart type="pie" [data]="chartData()" [options]="resolvedChartOptions()" [class]="chartClass()" (onDataSelect)="selectChartData($event)" />
  } @else {
  <div class="flex h-[300px] items-center justify-center rounded-border border border-surface-200 text-center text-muted-color dark:border-surface-700">
    {{ emptyMessage() }}
  </div>
  }
</div>
