<p-card class="h-full">
  <div class="mb-4 flex items-center justify-between gap-4">
    <div class="text-xl font-semibold text-surface-900 dark:text-surface-0">{{ title() }}</div>
    <p-button type="button" icon="pi pi-plus" [label]="addButtonLabel()" size="small" [outlined]="true" (click)="requestAdd()" />
  </div>

  @if (recipientRows().length) {
  <div class="flex flex-col gap-y-4">
    @for (row of recipientRows(); track row[0]?.id) {
    <div class="flex flex-col gap-4 lg:flex-row">
      @for (recipient of row; track recipient.id) {
      <button
        type="button"
        class="flex w-full items-center rounded border border-surface-200 p-4 text-left transition-colors hover:bg-surface-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary lg:w-6/12 dark:border-surface-700 dark:hover:bg-surface-700"
        [class.ring-2]="recipient.id === selectedRecipientId()"
        [class.ring-primary]="recipient.id === selectedRecipientId()"
        (click)="selectRecipient(recipient)"
      >
        <img [alt]="recipient.avatarAlt" [src]="recipient.avatarUrl" class="mr-2 w-8 shrink-0 rounded-full" />
        <span class="truncate text-lg font-medium text-surface-900 dark:text-surface-0">{{ recipient.name }}</span>
      </button>
      }
    </div>
    }
  </div>
  } @else {
  <div class="rounded-border border border-surface-200 p-6 text-center text-muted-color dark:border-surface-700">{{ emptyMessage() }}</div>
  }

  <div class="mt-8 flex flex-col gap-4 sm:flex-row">
    <p-inputnumber
      [inputId]="amountInputId()"
      [ngModel]="amount()"
      (ngModelChange)="changeAmount($event)"
      mode="currency"
      [currency]="currencyCode()"
      [locale]="locale()"
      [fluid]="true"
    />
    <p-button type="button" [label]="sendButtonLabel()" (click)="sendPayment()" />
  </div>
</p-card>
