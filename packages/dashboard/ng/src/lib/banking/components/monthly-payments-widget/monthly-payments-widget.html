<div class="card">
  <div class="mb-4 text-xl font-semibold text-surface-900 dark:text-surface-0">{{ title() }}</div>

  <p-table [value]="paymentViewModels()" [rows]="rows()" dataKey="id">
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Amount</th>
        <th>Date</th>
        <th>Status</th>
        @if (showPaymentActions()) {
        <th class="w-16">View</th>
        }
      </tr>
    </ng-template>
    <ng-template #body let-payment>
      <tr>
        <td>{{ payment.name }}</td>
        <td>{{ payment.amount | currency: currencyCode() : currencyDisplay() : currencyDigits() }}</td>
        <td>{{ payment.date }}</td>
        <td>
          <p-tag [value]="payment.statusLabel" [severity]="payment.severity" />
        </td>
        @if (showPaymentActions()) {
        <td>
          <p-button
            type="button"
            icon="pi pi-eye"
            [rounded]="true"
            [text]="true"
            [plain]="true"
            [ariaLabel]="'View ' + payment.name + ' payment'"
            (click)="selectPayment(payment)"
          />
        </td>
        }
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td [attr.colspan]="showPaymentActions() ? 5 : 4" class="text-center text-muted-color">{{ emptyMessage() }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
