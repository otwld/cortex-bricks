<div class="flex-1 self-stretch xl:rounded-tr-3xl xl:rounded-br-3xl flex flex-col overflow-hidden">
  <div class="self-stretch px-4 sm:px-6 xl:pl-8 xl:pr-6 pt-6 pb-4 flex items-center gap-4">
    <div class="flex-1 text-surface-950 dark:text-surface-0 text-xl font-medium leading-7">Location Information</div>
  </div>

  <div class="self-stretch flex flex-col gap-[9.14px]">
    <div class="self-stretch h-0 border-t border-dashed border-surface-200 dark:border-surface-700"></div>
  </div>

  <div class="self-stretch p-4 sm:p-6 xl:p-8 flex flex-col items-end gap-6">
    <div class="self-stretch grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="flex flex-col gap-2">
        <label for="location-country" class="text-surface-900 dark:text-surface-0 font-medium">Country</label>
        <p-select inputId="location-country" [ngModel]="formState().country" (ngModelChange)="updateField('country', $event)" [options]="countryOptions" placeholder="Select country" styleClass="w-full !rounded-[6px]" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="location-region" class="text-surface-900 dark:text-surface-0 font-medium">Region</label>
        <input id="location-region" pInputText [ngModel]="formState().region" (ngModelChange)="updateField('region', $event)" class="w-full !rounded-[6px]" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="location-city" class="text-surface-900 dark:text-surface-0 font-medium">City</label>
        <input id="location-city" pInputText [ngModel]="formState().city" (ngModelChange)="updateField('city', $event)" class="w-full !rounded-[6px]" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="location-postal-code" class="text-surface-900 dark:text-surface-0 font-medium">Postal Code</label>
        <input id="location-postal-code" pInputText [ngModel]="formState().postalCode" (ngModelChange)="updateField('postalCode', $event)" class="w-full !rounded-[6px]" />
      </div>
      <div class="flex flex-col gap-2 md:col-span-2">
        <label for="location-address-line-1" class="text-surface-900 dark:text-surface-0 font-medium">Address Line 1</label>
        <input id="location-address-line-1" pInputText [ngModel]="formState().addressLine1" (ngModelChange)="updateField('addressLine1', $event)" class="w-full !rounded-[6px]" />
      </div>
      <div class="flex flex-col gap-2 md:col-span-2">
        <label for="location-address-line-2" class="text-surface-900 dark:text-surface-0 font-medium">Address Line 2</label>
        <input id="location-address-line-2" pInputText [ngModel]="formState().addressLine2" (ngModelChange)="updateField('addressLine2', $event)" class="w-full !rounded-[6px]" />
      </div>
    </div>

    <div class="flex flex-col sm:flex-row items-stretch sm:items-start gap-3 sm:gap-4 w-full sm:w-auto">
      <p-button label="Cancel" severity="secondary" [outlined]="true" (onClick)="cancel()" styleClass="cursor-pointer !rounded-xl w-full sm:w-auto" />
      <p-button label="Continue" severity="primary" (onClick)="next()" styleClass="cursor-pointer !rounded-xl w-full sm:w-auto" />
    </div>
  </div>
</div>
