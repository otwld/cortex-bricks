<div class="flex-1 self-stretch xl:rounded-tr-3xl xl:rounded-br-3xl flex flex-col overflow-hidden">
  <div class="self-stretch px-4 sm:px-6 xl:pl-8 xl:pr-6 pt-6 pb-4 flex items-center gap-4">
    <div class="flex-1 text-surface-950 dark:text-surface-0 text-xl font-medium leading-7">Business Information</div>
  </div>

  <div class="self-stretch flex flex-col gap-[9.14px]">
    <div class="self-stretch h-0 border-t border-dashed border-surface-200 dark:border-surface-700"></div>
  </div>

  <div class="self-stretch p-4 sm:p-6 xl:p-8 flex flex-col items-end gap-6">
    <div class="self-stretch grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="flex flex-col gap-2">
        <label for="business-department" class="text-surface-900 dark:text-surface-0 font-medium">Department</label>
        <p-select inputId="business-department" [ngModel]="formState().department" (ngModelChange)="updateField('department', $event)" [options]="departmentOptions" placeholder="Select department" styleClass="w-full !rounded-[6px]" />
      </div>

      <div class="flex flex-col gap-2">
        <span id="business-position-label" class="text-surface-900 dark:text-surface-0 font-medium">Position</span>
        <p-selectbutton aria-labelledby="business-position-label" [ngModel]="formState().position" (ngModelChange)="updateField('position', $event)" [options]="positionOptions" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="business-employment-type" class="text-surface-900 dark:text-surface-0 font-medium">Employment Type</label>
        <p-select inputId="business-employment-type" [ngModel]="formState().employmentType" (ngModelChange)="updateField('employmentType', $event)" [options]="employmentTypeOptions" optionLabel="label" optionValue="value" placeholder="Select type" styleClass="w-full !rounded-[6px]" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="business-office-location" class="text-surface-900 dark:text-surface-0 font-medium">Office Location</label>
        <input id="business-office-location" pInputText [ngModel]="formState().officeLocation" (ngModelChange)="updateField('officeLocation', $event)" class="w-full !rounded-[6px]" />
      </div>

      <div class="flex items-center gap-3 md:col-span-2">
        <p-toggleswitch [ngModel]="formState().hybridWork" (ngModelChange)="updateField('hybridWork', $event)" />
        <span class="text-surface-900 dark:text-surface-0 text-base font-normal">Hybrid work enabled</span>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row items-stretch sm:items-start gap-3 sm:gap-4 w-full sm:w-auto">
      <p-button label="Cancel" severity="secondary" [outlined]="true" (onClick)="cancel()" styleClass="cursor-pointer !rounded-xl w-full sm:w-auto" />
      <p-button label="Continue" severity="primary" (onClick)="next()" styleClass="cursor-pointer !rounded-xl w-full sm:w-auto" />
    </div>
  </div>
</div>
