<div class="flex flex-col gap-4">
  <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
    <h1 class="text-2xl font-semibold text-surface-900 dark:text-surface-0">AI Completion</h1>
    <p-select
      [options]="modelOptions()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="selectedModel()"
      (ngModelChange)="selectedModel.set($event)"
      class="w-full md:w-56"
      ariaLabel="Completion model"
    />
  </div>

  <ai-usage-card />

  <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    <p-card class="flex flex-col gap-3">
      <label class="font-medium" for="ai-completion-prompt">Prompt</label>
      <textarea id="ai-completion-prompt" pTextarea rows="12" [ngModel]="prompt()" (ngModelChange)="prompt.set($event)" class="w-full"></textarea>
      <div class="flex flex-wrap gap-2">
        <p-button label="Generate" icon="pi pi-send" [loading]="completion.loading()" (onClick)="submit()" />
        <p-button label="Abort" icon="pi pi-stop" severity="secondary" [outlined]="true" (onClick)="abort()" />
      </div>
    </p-card>

    <p-card>
      <h2 class="mb-3 text-lg font-semibold">Output</h2>
      @if (completion.error()) {
        <p class="text-red-500">{{ completion.error()?.message }}</p>
      } @else {
        <pre class="min-h-72 whitespace-pre-wrap text-sm leading-6">{{ completion.text() }}</pre>
      }
    </p-card>
  </div>
</div>
