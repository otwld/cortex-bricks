<div class="card">
  <h1 class="mb-4 text-2xl font-semibold text-surface-900 dark:text-surface-0">AI Tools</h1>
  <p-table [value]="tools()">
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Approval</th>
      </tr>
    </ng-template>
    <ng-template #body let-tool>
      <tr>
        <td>{{ tool.name }}</td>
        <td>{{ tool.description }}</td>
        <td>{{ tool.requiresApproval ? 'Required' : 'Automatic' }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
